services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ThreatRAG-postgres
    environment:
      POSTGRES_DB: ThreatRAG
      POSTGRES_USER: ThreatRAG
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: